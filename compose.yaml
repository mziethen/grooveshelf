services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      GROOVESHELF_DATABASE: /data/grooveshelf.sqlite3
    volumes:
      - collection-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${GROOVESHELF_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
volumes:
  collection-data:
