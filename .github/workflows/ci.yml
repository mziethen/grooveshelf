name: Application checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pip install -r backend/requirements-dev.txt
      - run: pytest -q
      - run: npm ci --prefix frontend --ignore-scripts
      - run: cd frontend && npx playwright install --with-deps chromium
      - name: Browser integration
        run: |
          PYTHONPATH=backend GROOVESHELF_DATABASE=/tmp/grooveshelf-ci.sqlite3 uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          python scripts/dev_server.py &
          for attempt in $(seq 1 30); do
            if curl --fail http://127.0.0.1:8080/api/health; then break; fi
            sleep 1
          done
          curl --fail http://127.0.0.1:8080/api/health
          GROOVESHELF_TEST_URL=http://127.0.0.1:8080 npm test --prefix frontend
      - run: docker compose config --quiet
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: linux/amd64,linux/arm64
          push: false
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          platforms: linux/amd64,linux/arm64
          push: false
      - name: Compose runtime smoke test
        run: |
          docker compose up --build -d --wait
          for attempt in $(seq 1 30); do
            if curl --fail http://localhost:8080/api/health; then break; fi
            sleep 1
          done
          curl --fail http://localhost:8080/api/health
          curl --fail http://localhost:8080/vendor/qrcode-generator.js | python -c 'import sys; assert "export default qrcode" in sys.stdin.read()'
          curl --fail http://localhost:8080/streaming.js | python -c 'import sys; assert "export function albumSearchLinks" in sys.stdin.read()'
          curl --fail http://localhost:8080/tracks.js | python -c 'import sys; assert "export function trackLine" in sys.stdin.read()'
          curl --fail http://localhost:8080/pressings.js | python -c 'import sys; assert "export function pressingMarkup" in sys.stdin.read()'
          curl --fail http://localhost:8080/design.css | python -c 'import sys; assert "--nav-paper" in sys.stdin.read()'
          curl --fail http://localhost:8080/release-notes.js | python -c 'import sys; assert "export function releaseNotesMarkup" in sys.stdin.read()'
          curl --fail http://localhost:8080/credits.js | python -c 'import sys; assert "export function creditsMarkup" in sys.stdin.read()'
          curl --fail http://localhost:8080/corrections.js | python -c 'import sys; assert "export function createCorrections" in sys.stdin.read()'
          curl --fail http://localhost:8080/photos.js | python -c 'import sys; assert "export function createPhotos" in sys.stdin.read()'
          curl --fail -X POST http://localhost:8080/api/records -H 'Content-Type: application/json' --data '{"inventory_number":"LP-00001","artist":"CI artist","title":"Persistence check"}'
          python - <<'PYPHOTO'
          import random, struct, zlib
          from pathlib import Path
          pixels = random.Random(0).randbytes(700 * 700 * 3)
          raw = b''.join(b'\0' + pixels[offset:offset+2100] for offset in range(0, len(pixels), 2100))
          def chunk(kind, data):
              return struct.pack('>I', len(data)) + kind + data + struct.pack('>I', zlib.crc32(kind + data))
          png = b'\x89PNG\r\n\x1a\n' + chunk(b'IHDR', struct.pack('>IIBBBBB', 700, 700, 8, 2, 0, 0, 0)) + chunk(b'IDAT', zlib.compress(raw)) + chunk(b'IEND', b'')
          assert len(png) > 1024 * 1024
          Path('/tmp/grooveshelf-smoke-photo.png').write_bytes(png)
          PYPHOTO
          photo_copy_id=$(curl --fail http://localhost:8080/api/records | python -c 'import json,sys; print(json.load(sys.stdin)[0]["id"])')
          curl --fail -X POST "http://localhost:8080/api/records/$photo_copy_id/photos?kind=cover" -H 'Content-Type: image/png' --data-binary @/tmp/grooveshelf-smoke-photo.png | python -c 'import json,sys; photo=json.load(sys.stdin); assert photo["width"] == 700 and photo["height"] == 700'
          docker compose restart backend
          for attempt in $(seq 1 30); do
            if curl --fail http://localhost:8080/api/health; then break; fi
            sleep 1
          done
          curl --fail http://localhost:8080/api/records | python -c 'import json,sys; record=json.load(sys.stdin)[0]; assert record["inventory_number"] == "LP-00001" and record["photo_count"] == 1'
      - name: Container logs
        if: failure()
        run: docker compose logs
      - name: Clean up
        if: always()
        run: docker compose down -v
